<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Universi 🌙</title>

    <!-- Conecta este archivo con nuestro diseño -->
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">

        <div class="logo-luna">☾</div>

        <h1 class="titulo">MI UNIVERSI</h1>

        <p class="subtitulo">
            Archivo de personajes
        </p>

    </header>


    <!-- BUSCADOR -->
    <section class="contenedor-buscador">

        <input
            class="buscador"
            type="text"
            placeholder="Buscar personaje..."
        >

    </section>


    <!-- CATEGORÍAS -->
    <nav class="categorias">

        <button class="categoria">TODOS</button>

        <button class="categoria">RAZAS</button>

        <button class="categoria">MONTURAS</button>

        <button class="categoria">RELACIONES</button>

        <button class="categoria">NPC'S</button>

    </nav>


    <!-- PERSONAJES -->
 <main class="personajes" id="lista-personajes">

 </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    alert("Supabase: " + typeof window.supabase);
    const SUPABASE_URL = "https://uuwowbesazxwyaklsxlj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_mHDd4OWJdD-Td0fEANHAXg_HdUk73tU";

    const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function cargarPersonajes() {
        console.log("1 - La función empezó");
        
        const { data, error } = await supabase
            .from("personajes")
            .select("*")
            .order("id");

        if (error) {
           alert("Error de Supabase: " + error.message);
            return;
        }

        const lista = document.getElementById("lista-personajes");
        
lista.innerHTML = "";

data.forEach(personaje => {
  const tarjeta = document.createElement("article");
  tarjeta.className = "tarjeta";

  tarjeta.innerHTML = `
    <div class="imagen-personaje">IMAGEN</div>
    <h2 class="nombre">${personaje.name || "Sin nombre"}</h2>
    <p class="rol">${personaje.alias || "Personaje"}</p>
  `;

  lista.appendChild(tarjeta);
});
    }

    cargarPersonajes();
</script>

</body>
</html>
