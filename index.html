<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Universi 🌙</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">

        <div class="logo-luna">☾</div>

        <h1 class="titulo">MI UNIVERSI</h1>

        <p class="subtitulo">
            Archivo de personajes
        </p>

    </header>


    <!-- BUSCADOR -->
    <section class="contenedor-buscador">

        <input
            class="buscador"
            type="text"
            placeholder="Buscar personaje..."
        >

    </section>


    <!-- CATEGORÍAS -->
    <nav class="categorias">

        <button class="categoria">TODOS</button>

        <button class="categoria">RAZAS</button>

        <button class="categoria">MONTURAS</button>

        <button class="categoria">RELACIONES</button>

        <button class="categoria">NPC'S</button>

    </nav>


<!-- PERSONAJES -->
<main class="personajes" id="lista-personajes">
</main>


<!-- CONEXIÓN CON SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    // Datos de nuestro proyecto
    const SUPABASE_URL =
        "https://uuwowbesazxwyaklsxlj.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_mHDd4OWJdD-Td0fEANHAXg_HdUk73tU";


    // Creamos la conexión
    const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // Cargar personajes
    async function cargarPersonajes() {

        const lista =
            document.getElementById("lista-personajes");


        // Mensaje mientras carga
        lista.innerHTML =
            "<p>Cargando personajes... 🌙</p>";


        // Pedimos los personajes a Supabase
        const { data, error } = await supabase
            .from("personajes")
            .select("*")
            .order("id", { ascending: true });


        // Si ocurre un error
        if (error) {

            console.error(error);

            lista.innerHTML =
                "<p>No se pudieron cargar los personajes 😭</p>";

            return;
        }


        // Si la tabla está vacía
        if (!data || data.length === 0) {

            lista.innerHTML =
                "<p>Todavía no hay personajes 🌙</p>";

            return;
        }


        // Limpiamos el mensaje de carga
        lista.innerHTML = "";


        // Crear una tarjeta por personaje
        data.forEach(personaje => {

            const tarjeta =
                document.createElement("article");

            tarjeta.className = "tarjeta";


            // Imagen
            let imagen = "";

            if (personaje.image_url) {

                imagen = `
                    <img
                        src="${personaje.image_url}"
                        alt="${personaje.name || "Personaje"}"
                        style="
                            width:100%;
                            height:100%;
                            object-fit:cover;
                        "
                    >
                `;

            } else {

                imagen = "IMAGEN";

            }


            tarjeta.innerHTML = `

                <div class="imagen-personaje">
                    ${imagen}
                </div>

                <h2 class="nombre">
                    ${personaje.name || "Sin nombre"}
                </h2>

                <p class="rol">
                    ${personaje.alias || "Personaje"}
                </p>

            `;


            lista.appendChild(tarjeta);

        });

    }


    // Ejecutar
    cargarPersonajes();

</script>

</body>
</html>
