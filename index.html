<!DOCTYPE html>
<html lang="es">
<head>

</head>

<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">

        <div class="logo-luna">☾</div>

        <h1 class="titulo">MI UNIVERSI</h1>

        <p class="subtitulo">
            Archivo de personajes
        </p>

    </header>


    <!-- BUSCADOR -->
    <section class="contenedor-buscador">

        <input
            class="buscador"
            type="text"
            placeholder="Buscar personaje..."
        >

    </section>


    <!-- CATEGORÍAS -->
    <nav class="categorias">

        <button class="categoria">TODOS</button>

        <button class="categoria">RAZAS</button>

        <button class="categoria">MONTURAS</button>

        <button class="categoria">RELACIONES</button>

        <button class="categoria">NPC'S</button>

    <!-- PERSONAJES -->
 <main class="personajes" id="lista-personajes">

 </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    alert("1. Supabase: " + typeof window.supabase);

    const SUPABASE_URL = "https://uuwowbesazxwyaklsxlj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_mHDd4OWJdD-Td0fEANHAXg_HdUk73tU";

    const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    alert("2. Cliente creado");

    async function cargarPersonajes() {

        alert("3. Intentando cargar personajes");

        const { data, error } = await supabase
            .from("personajes")
            .select("*");

        if (error) {
            alert("4. ERROR: " + error.message);
            return;
        }

        alert("5. Personajes encontrados: " + data.length);

        console.log(data);
    }

    cargarPersonajes();
</script>
</body>
