<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Universi 🌙</title>

    <!-- Conecta este archivo con nuestro diseño -->
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- ENCABEZADO -->

        <div class="logo-luna">☾</div>

        <h1 class="titulo">MI UNIVERSI</h1>

            Archivo de personajes
        </p>

    </header>


    <!-- BUSCADOR -->

        <input
            class="buscador"
            type="text"
            placeholder="Buscar personaje..."

    </section>


    <!-- CATEGORÍAS -->

        <button class="categoria">TODOS</button>

        <button class="categoria">RAZAS</button>

        <button class="categoria">RELACIONES</button>

        <button class="categoria">NPC'S</button>

    </nav>


    <!-- PERSONAJES -->
    <main class="personajes">

        <!-- TARJETA 1 -->
        <article class="tarjeta">

            <div class="imagen-personaje">
                IMAGEN
            </div>

            <h2 class="nombre">
                Yue
            </h2>

            <p class="rol">
                Personaje
            </p>

        </article>


        <!-- TARJETA 2 -->
        <article class="tarjeta">

            <div class="imagen-personaje">
                IMAGEN
            </div>

            <h2 class="nombre">
                Personaje 2
            </h2>

            <p class="rol">
                Personaje
            </p>

        </article>


        <!-- TARJETA 3 -->
        <article class="tarjeta">

            <div class="imagen-personaje">
                IMAGEN
            </div>

            <h2 class="nombre">
                Personaje 3
            </h2>

            <p class="rol">
                Personaje
            </p>

        </article>

    </main>

</body>
</html>
